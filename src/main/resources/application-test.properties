spring.application.name=customermanagement
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

## Server Configuration ##
server.servlet.context-path=/api
server.port=8085
logging.level.org.hibernate.sql=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
spring.jackson.serialization.fail-on-empty-beans=false

urlDumpMac = /usr/local/mysql-8.0.31-macos12-arm64/bin/mysqldump -u%s -p%s -h%s -P%s %s
urlDumpLinux = /usr/bin/mysqldump -u%s -p%s -h%s -P%s %s
urlDumpWin = C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump -u%s -p%s -h%s -P%s %s
urlUpload = C:/Users/SunSun/Desktop/image
urlUploadWin = C:/Users/SunSun/Desktop/image
urlUploadMac = /Users/nguyentuan/inteljproject/upload/
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USER}
spring.data.redis.password=${REDIS_PASS}
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

app.cache.cron: 0 30 * * * *

isKafka: 1
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9005
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
redirect_uri=http://localhost:4200/oauth2/callback
spring.boot.admin.client.url=http://localhost:8081
spring.boot.admin.client.instance.prefer-ip=true
management.endpoints.web.exposure.include=*






